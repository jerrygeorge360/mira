<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">MIRA - inspectable memory for AI agents</title>
  <desc id="description">MIRA turns conversations into session memory, durable facts, typed graph relationships, and retrieval traces.</desc>
  <rect width="1200" height="630" fill="#f6f2ea"/>
  <rect x="800" width="400" height="630" fill="#282623"/>

  <g transform="translate(76 66) scale(1.3)">
    <path d="M32 9C28 20 20 28 9 32c11 4 19 12 23 23 4-11 12-19 23-23C44 28 36 20 32 9Z" fill="none" stroke="#282623" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
    <circle cx="32" cy="8" r="5" fill="#282623"/>
    <circle cx="56" cy="32" r="5" fill="#282623"/>
    <circle cx="32" cy="56" r="5" fill="#282623"/>
    <circle cx="8" cy="32" r="5" fill="#282623"/>
    <path d="M32 22c1.7 5.2 4.8 8.3 10 10-5.2 1.7-8.3 4.8-10 10-1.7-5.2-4.8-8.3-10-10 5.2-1.7 8.3-4.8 10-10Z" fill="#c96f4f"/>
  </g>
  <text x="180" y="126" fill="#282623" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="750">MIRA</text>
  <text x="76" y="238" fill="#282623" font-family="Inter, Arial, sans-serif" font-size="55" font-weight="700">Inspectable memory</text>
  <text x="76" y="302" fill="#282623" font-family="Inter, Arial, sans-serif" font-size="55" font-weight="700">for AI agents.</text>
  <text x="78" y="374" fill="#66615a" font-family="Inter, Arial, sans-serif" font-size="25">Conversations become scoped memory, durable facts,</text>
  <text x="78" y="410" fill="#66615a" font-family="Inter, Arial, sans-serif" font-size="25">typed relationships, and traceable retrieval.</text>

  <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">
    <rect x="78" y="466" width="174" height="42" rx="7" fill="#eee4da" stroke="#d7c9bc"/>
    <text x="99" y="493" fill="#544f49">Session memory</text>
    <rect x="264" y="466" width="151" height="42" rx="7" fill="#eee4da" stroke="#d7c9bc"/>
    <text x="286" y="493" fill="#544f49">Durable facts</text>
    <rect x="427" y="466" width="152" height="42" rx="7" fill="#eee4da" stroke="#d7c9bc"/>
    <text x="449" y="493" fill="#544f49">Typed graph</text>
    <rect x="591" y="466" width="147" height="42" rx="7" fill="#eee4da" stroke="#d7c9bc"/>
    <text x="613" y="493" fill="#544f49">Answer traces</text>
  </g>
  <text x="78" y="572" fill="#8b837a" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="650">mira.ninja</text>

  <g stroke-linecap="round" stroke-width="3">
    <path d="M889 164 L1029 244" stroke="#8d8983"/>
    <path d="M1029 244 L932 354" stroke="#c96f4f"/>
    <path d="M1029 244 L1103 392" stroke="#8d8983"/>
    <path d="M932 354 L1031 486" stroke="#8d8983"/>
    <path d="M1103 392 L1031 486" stroke="#c96f4f"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(889 164)">
      <circle r="44" fill="#f6f2ea" stroke="#d8cec3" stroke-width="3"/>
      <text y="-2" text-anchor="middle" fill="#282623" font-size="14" font-weight="750">Session</text>
      <text y="17" text-anchor="middle" fill="#746e67" font-size="12">source</text>
    </g>
    <g transform="translate(1029 244)">
      <circle r="55" fill="#f6f2ea" stroke="#c96f4f" stroke-width="4"/>
      <text y="-3" text-anchor="middle" fill="#282623" font-size="15" font-weight="750">Atomic fact</text>
      <text y="18" text-anchor="middle" fill="#746e67" font-size="12">active</text>
    </g>
    <g transform="translate(932 354)">
      <circle r="48" fill="#363330" stroke="#a6a099" stroke-width="3"/>
      <text y="-2" text-anchor="middle" fill="#f6f2ea" font-size="14" font-weight="750">Previous</text>
      <text y="17" text-anchor="middle" fill="#bbb5ae" font-size="12">superseded</text>
    </g>
    <g transform="translate(1103 392)">
      <circle r="47" fill="#363330" stroke="#a6a099" stroke-width="3"/>
      <text y="-2" text-anchor="middle" fill="#f6f2ea" font-size="14" font-weight="750">Entity</text>
      <text y="17" text-anchor="middle" fill="#bbb5ae" font-size="12">linked</text>
    </g>
    <g transform="translate(1031 486)">
      <circle r="52" fill="#c96f4f" stroke="#efc0ae" stroke-width="3"/>
      <text y="-2" text-anchor="middle" fill="#fffaf5" font-size="14" font-weight="750">Retrieval</text>
      <text y="17" text-anchor="middle" fill="#fff0e8" font-size="12">trace</text>
    </g>
    <text x="936" y="186" fill="#bbb5ae" font-size="11" font-weight="650">DERIVED_FROM</text>
    <text x="939" y="293" fill="#efb098" font-size="11" font-weight="650">SUPERSEDES</text>
    <text x="1045" y="325" fill="#bbb5ae" font-size="11" font-weight="650">MENTIONS</text>
  </g>
</svg>

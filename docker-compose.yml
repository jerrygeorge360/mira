services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      MIRA_DB_PATH: /data/sqlite/mira.db
      CHROMA_DB_PATH: /data/chroma
      LOCAL_EMBEDDING_CACHE_DIR: /data/model-cache
      MIRA_API_CORS_ORIGINS: ${MIRA_API_CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-5173}}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:${API_PORT:-8000}/auth/github/callback}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${FRONTEND_PORT:-5173}}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MIRA_SESSION_TTL_MINUTES: ${MIRA_SESSION_TTL_MINUTES:-120}
      MIRA_PROMPT_TOKEN_BUDGET: ${MIRA_PROMPT_TOKEN_BUDGET:-32000}
    volumes:
      - ./.docker-data/sqlite:/data/sqlite
      - ./.docker-data/chroma:/data/chroma
      - ./.docker-data/model-cache:/data/model-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command:
      - python
      - -m
      - scripts.run_worker
      - --batch-size
      - "20"
      - --poll-interval
      - "2"
    env_file:
      - .env
    environment:
      MIRA_DB_PATH: /data/sqlite/mira.db
      CHROMA_DB_PATH: /data/chroma
      LOCAL_EMBEDDING_CACHE_DIR: /data/model-cache
    volumes:
      - ./.docker-data/sqlite:/data/sqlite
      - ./.docker-data/chroma:/data/chroma
      - ./.docker-data/model-cache:/data/model-cache
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:${API_PORT:-8000}}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 30s
      timeout: 5s
      retries: 5

  devtools:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      MIRA_DB_PATH: /data/sqlite/mira.db
      CHROMA_DB_PATH: /data/chroma
      LOCAL_EMBEDDING_CACHE_DIR: /data/model-cache
    volumes:
      - ./.docker-data/sqlite:/data/sqlite
      - ./.docker-data/chroma:/data/chroma
      - ./.docker-data/model-cache:/data/model-cache

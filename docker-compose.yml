services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      MIRA_DB_PATH: /data/sqlite/mira.db
      CHROMA_DB_PATH: /data/chroma
      LOCAL_EMBEDDING_CACHE_DIR: /data/model-cache
      MIRA_API_CORS_ORIGINS: ${MIRA_API_CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-5173}}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:${API_PORT:-8000}/auth/github/callback}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${FRONTEND_PORT:-5173}}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MIRA_SESSION_TTL_MINUTES: ${MIRA_SESSION_TTL_MINUTES:-120}
      MIRA_PROMPT_TOKEN_BUDGET: ${MIRA_PROMPT_TOKEN_BUDGET:-32000}
      MIRA_OAUTH_ISSUER_URL: ${MIRA_OAUTH_ISSUER_URL:-http://localhost:8000}
      MIRA_MCP_PUBLIC_URL: ${MIRA_MCP_PUBLIC_URL:-http://localhost:8090}
      MIRA_OAUTH_FIRST_PARTY_CLIENTS: ${MIRA_OAUTH_FIRST_PARTY_CLIENTS:-[]}
      MIRA_OAUTH_ACCESS_TOKEN_TTL_SECONDS: ${MIRA_OAUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      MIRA_OAUTH_REFRESH_TOKEN_TTL_DAYS: ${MIRA_OAUTH_REFRESH_TOKEN_TTL_DAYS:-30}
    volumes:
      - ./.docker-data/sqlite:/data/sqlite
      - ./.docker-data/chroma:/data/chroma
      - ./.docker-data/model-cache:/data/model-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command:
      - python
      - -m
      - scripts.run_worker
      - --batch-size
      - "20"
      - --poll-interval
      - "2"
    env_file:
      - .env
    environment:
      MIRA_DB_PATH: /data/sqlite/mira.db
      CHROMA_DB_PATH: /data/chroma
      LOCAL_EMBEDDING_CACHE_DIR: /data/model-cache
    volumes:
      - ./.docker-data/sqlite:/data/sqlite
      - ./.docker-data/chroma:/data/chroma
      - ./.docker-data/model-cache:/data/model-cache
    depends_on:
      api:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command:
      - uvicorn
      - integrations.mcp.service:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    ports:
      - "${MCP_PORT:-8090}:8090"
    env_file:
      - .env
    environment:
      MIRA_DB_PATH: /data/sqlite/mira.db
      CHROMA_DB_PATH: /data/chroma
      LOCAL_EMBEDDING_CACHE_DIR: /data/model-cache
      MIRA_MCP_API_KEY: ${MIRA_MCP_API_KEY:-}
      MIRA_MCP_WORKSPACE_ID: ${MIRA_MCP_WORKSPACE_ID:-workspace_legacy_default}
      MIRA_MCP_TOKEN_WORKSPACES: ${MIRA_MCP_TOKEN_WORKSPACES:-}
      MIRA_MCP_PUBLIC_URL: ${MIRA_MCP_PUBLIC_URL:-http://localhost:8090}
      MIRA_OAUTH_ISSUER_URL: ${MIRA_OAUTH_ISSUER_URL:-http://localhost:8000}
      MIRA_MCP_ISSUER_URL: ${MIRA_MCP_ISSUER_URL:-}
    volumes:
      - ./.docker-data/sqlite:/data/sqlite
      - ./.docker-data/chroma:/data/chroma
      - ./.docker-data/model-cache:/data/model-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:${API_PORT:-8000}}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 30s
      timeout: 5s
      retries: 5

  logs:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock 
    ports:
      - 8080:8080

  devtools:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      MIRA_DB_PATH: /data/sqlite/mira.db
      CHROMA_DB_PATH: /data/chroma
      LOCAL_EMBEDDING_CACHE_DIR: /data/model-cache
    volumes:
      - ./.docker-data/sqlite:/data/sqlite
      - ./.docker-data/chroma:/data/chroma
      - ./.docker-data/model-cache:/data/model-cache

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev toolchain
        run: pip install -r requirements-dev.txt

      - name: Run all checks
        # The Makefile drives a local virtualenv; on CI the toolchain is already
        # on PATH, so invoke the tools directly to mirror `make check`.
        run: |
          ruff check .
          ruff format --check .
          mypy core ui slack evaluation scripts
          bandit -q -r core ui slack evaluation scripts
          pytest

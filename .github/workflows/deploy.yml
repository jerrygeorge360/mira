  name: Deploy

  on:
    workflow_run:
      workflows: [ "CI" ]
      types:
        - completed
      branches:
        - main

  jobs:
    build-and-deploy:
      runs-on: ubuntu-latest
      if: ${{ github.event.workflow_run.conclusion == 'success' }}

      steps:
        - uses: actions/checkout@v4

        - name: Login to DockerHub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and push API
          uses: docker/build-push-action@v6
          with:
            context: .
            target: base
            push: true
            tags: |
              deltronfr/mira-api:${{ github.sha }}
              deltronfr/mira-api:latest

        - name: Build and push frontend
          uses: docker/build-push-action@v6
          with:
            context: ./frontend
            target: production
            push: true
            build-args: |
              VITE_API_URL=/api
            tags: |
              deltronfr/mira-frontend:${{ github.sha }}
              deltronfr/mira-frontend:latest

        - name: Configure SSH
          run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

        - name: Deploy on server
          run: |
            ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << EOF
              set -e
              cd ~/mira

              docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"

              IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml pull
              IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml up -d --remove-orphans
              docker compose exec -T nginx nginx -s reload

              docker image prune -f
            EOF

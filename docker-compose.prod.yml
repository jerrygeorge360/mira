services:
  api:
    image: deltronfr/mira-api:${IMAGE_TAG:-latest}
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      MIRA_DB_PATH: /data/sqlite/mira.db
      CHROMA_DB_PATH: /data/chroma
      MIRA_API_CORS_ORIGINS: ${MIRA_API_CORS_ORIGINS:-http://localhost}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost/api/auth/github/callback}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MIRA_SESSION_TTL_MINUTES: ${MIRA_SESSION_TTL_MINUTES:-120}
      MIRA_PROMPT_TOKEN_BUDGET: ${MIRA_PROMPT_TOKEN_BUDGET:-32000}
    volumes:
      - ./.docker-data/sqlite:/data/sqlite
      - ./.docker-data/chroma:/data/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    image: deltronfr/mira-api:${IMAGE_TAG:-latest}
    command:
      - python
      - -m
      - scripts.run_worker
      - --batch-size
      - "20"
      - --poll-interval
      - "2"
    env_file:
      - .env
    environment:
      MIRA_DB_PATH: /data/sqlite/mira.db
      CHROMA_DB_PATH: /data/chroma
    volumes:
      - ./.docker-data/sqlite:/data/sqlite
      - ./.docker-data/chroma:/data/chroma
    depends_on:
      api:
        condition: service_healthy

  frontend:
    image: deltronfr/mira-frontend:${IMAGE_TAG:-latest}
    expose:
      - "5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy


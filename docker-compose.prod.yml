services:
  api:
    image: deltronfr/mira-api:${IMAGE_TAG:-latest}
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      MIRA_DB_PATH: /data/sqlite/mira.db
      CHROMA_DB_PATH: /data/chroma
      MIRA_API_CORS_ORIGINS: ${MIRA_API_CORS_ORIGINS:-http://localhost}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost/api/auth/github/callback}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MIRA_SESSION_TTL_MINUTES: ${MIRA_SESSION_TTL_MINUTES:-120}
      MIRA_PROMPT_TOKEN_BUDGET: ${MIRA_PROMPT_TOKEN_BUDGET:-32000}
      MIRA_OAUTH_ISSUER_URL: ${MIRA_OAUTH_ISSUER_URL:-https://mira.ninja}
      MIRA_MCP_PUBLIC_URL: ${MIRA_MCP_PUBLIC_URL:-https://mira.ninja/mcp}
      MIRA_OAUTH_FIRST_PARTY_CLIENTS: ${MIRA_OAUTH_FIRST_PARTY_CLIENTS:-[]}
      MIRA_OAUTH_ACCESS_TOKEN_TTL_SECONDS: ${MIRA_OAUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      MIRA_OAUTH_REFRESH_TOKEN_TTL_DAYS: ${MIRA_OAUTH_REFRESH_TOKEN_TTL_DAYS:-30}
    volumes:
      - ./.docker-data/sqlite:/data/sqlite
      - ./.docker-data/chroma:/data/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    image: deltronfr/mira-api:${IMAGE_TAG:-latest}
    command:
      - python
      - -m
      - scripts.run_worker
      - --batch-size
      - "20"
      - --poll-interval
      - "2"
    env_file:
      - .env
    environment:
      MIRA_DB_PATH: /data/sqlite/mira.db
      CHROMA_DB_PATH: /data/chroma
    volumes:
      - ./.docker-data/sqlite:/data/sqlite
      - ./.docker-data/chroma:/data/chroma
    depends_on:
      api:
        condition: service_healthy

  mcp:
    image: deltronfr/mira-api:${IMAGE_TAG:-latest}
    command:
      - uvicorn
      - integrations.mcp.service:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    expose:
      - "8090"
    env_file:
      - .env
    environment:
      MIRA_DB_PATH: /data/sqlite/mira.db
      CHROMA_DB_PATH: /data/chroma
      MIRA_MCP_API_KEY: ${MIRA_MCP_API_KEY:-}
      MIRA_MCP_WORKSPACE_ID: ${MIRA_MCP_WORKSPACE_ID:-workspace_legacy_default}
      MIRA_MCP_TOKEN_WORKSPACES: ${MIRA_MCP_TOKEN_WORKSPACES:-}
      MIRA_MCP_PUBLIC_URL: ${MIRA_MCP_PUBLIC_URL:-https://mira.ninja/mcp}
      MIRA_OAUTH_ISSUER_URL: ${MIRA_OAUTH_ISSUER_URL:-https://mira.ninja}
    volumes:
      - ./.docker-data/sqlite:/data/sqlite
      - ./.docker-data/chroma:/data/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    image: deltronfr/mira-frontend:${IMAGE_TAG:-latest}
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s

  logs:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock 
    expose:
      - "8080"
    environment:
      DOZZLE_BASE: /logs

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        - ./nginx/nginx_secrets:/etc/nginx/secrets:ro
        - certbot-www:/var/www/certbot
        - certbot-etc:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
      frontend:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-etc:/etc/letsencrypt

volumes:
  certbot-www:
  certbot-etc:
